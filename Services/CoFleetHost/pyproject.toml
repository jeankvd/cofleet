[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cofleet-host"
version = "0.1.0"
description = "Local, authenticated Codex app-server facade for CoFleet"
requires-python = ">=3.9"
license = { text = "GPL-3.0-only with an additional permission under GPLv3 section 7" }
authors = [{ name = "Jean Diaz" }]
dependencies = []

[project.scripts]
cofleet-host = "cofleet_host.cli:main"

[tool.setuptools]
packages = ["cofleet_host"]
