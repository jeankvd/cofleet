name: CoFleet

options:
  bundleIdPrefix: com.example.cofleet
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    watchOS: "10.0"
  xcodeVersion: "26.0"
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: "2"
    MARKETING_VERSION: "0.1.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES

packages:
  CoFleetKit:
    path: Packages/CoFleetKit

fileGroups:
  - README.md
  - LICENSE
  - CONTRIBUTING.md
  - SECURITY.md
  - PRIVACY.md
  - CHANGELOG.md
  - THIRD_PARTY_NOTICES.md

targets:
  CoFleetMac:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: Apps/macOS/CoFleetMac
      - path: Apps/Shared
      - path: Assets/SharedAssets.xcassets
      - path: Assets/macOS.xcassets
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
    dependencies:
      - package: CoFleetKit
        product: CoFleetCore
      - package: CoFleetKit
        product: CoFleetTransport
      - package: CoFleetKit
        product: CoFleetCodex
      - package: CoFleetKit
        product: CoFleetUI
    settings:
      base:
        PRODUCT_NAME: CoFleet
        PRODUCT_MODULE_NAME: CoFleetMac
        PRODUCT_BUNDLE_IDENTIFIER: $(COFLEET_BUNDLE_ID_PREFIX).mac
        INFOPLIST_FILE: Config/Info/CoFleetMac-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/CoFleetMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
    scheme:
      gatherCoverageData: true
      testTargets:
        - CoFleetMacUITests

  CoFleetIOS:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: Apps/iOS/CoFleetIOS
      - path: Apps/Shared
      - path: Assets/SharedAssets.xcassets
      - path: Assets/iOS.xcassets
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
    dependencies:
      - package: CoFleetKit
        product: CoFleetCore
      - package: CoFleetKit
        product: CoFleetTransport
      - package: CoFleetKit
        product: CoFleetCodex
      - package: CoFleetKit
        product: CoFleetUI
      - target: CoFleetWidgets
        embed: true
      - target: CoFleetWatch
        embed: true
    settings:
      base:
        PRODUCT_NAME: CoFleet
        PRODUCT_MODULE_NAME: CoFleetIOS
        PRODUCT_BUNDLE_IDENTIFIER: $(COFLEET_BUNDLE_ID_PREFIX).ios
        INFOPLIST_FILE: Config/Info/CoFleetIOS-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/CoFleetIOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    scheme:
      gatherCoverageData: true
      testTargets:
        - CoFleetIOSUITests

  CoFleetWatch:
    type: application
    platform: watchOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: Apps/watchOS/CoFleetWatch
      - path: Apps/Shared
      - path: Assets/SharedAssets.xcassets
      - path: Assets/watchOS.xcassets
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: CoFleetKit
        product: CoFleetCore
      - package: CoFleetKit
        product: CoFleetTransport
      - package: CoFleetKit
        product: CoFleetCodex
      - package: CoFleetKit
        product: CoFleetUI
      - target: CoFleetWatchWidgets
        embed: true
    settings:
      base:
        PRODUCT_NAME: CoFleet Watch
        PRODUCT_MODULE_NAME: CoFleetWatch
        PRODUCT_BUNDLE_IDENTIFIER: $(COFLEET_BUNDLE_ID_PREFIX).ios.watchkitapp
        INFOPLIST_FILE: Config/Info/CoFleetWatch-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/CoFleetWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks
    scheme:
      gatherCoverageData: false

  CoFleetWidgets:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: Apps/Widgets/CoFleetWidgets
      - path: Assets/SharedAssets.xcassets
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: CoFleetKit
        product: CoFleetCore
      - package: CoFleetKit
        product: CoFleetUI
    settings:
      base:
        PRODUCT_NAME: CoFleet Widgets
        PRODUCT_MODULE_NAME: CoFleetWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(COFLEET_BUNDLE_ID_PREFIX).ios.widgets
        INFOPLIST_FILE: Config/Info/CoFleetWidgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/CoFleetWidgets.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    scheme:
      gatherCoverageData: false

  CoFleetWatchWidgets:
    type: app-extension
    platform: watchOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: Apps/Widgets/CoFleetWatchWidgets
      - path: Assets/SharedAssets.xcassets
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: CoFleetKit
        product: CoFleetCore
      - package: CoFleetKit
        product: CoFleetUI
    settings:
      base:
        PRODUCT_NAME: CoFleet Complications
        PRODUCT_MODULE_NAME: CoFleetWatchWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(COFLEET_BUNDLE_ID_PREFIX).ios.watchkitapp.widgets
        INFOPLIST_FILE: Config/Info/CoFleetWatchWidgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/CoFleetWidgets.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks @executable_path/../../Frameworks @executable_path/../../../../Frameworks
    scheme:
      gatherCoverageData: false

  CoFleetIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: Tests/CoFleetIOSUITests
    dependencies:
      - target: CoFleetIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(COFLEET_BUNDLE_ID_PREFIX).ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CoFleetIOS
        TARGETED_DEVICE_FAMILY: "1"

  CoFleetMacUITests:
    type: bundle.ui-testing
    platform: macOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: Tests/CoFleetMacUITests
    dependencies:
      - target: CoFleetMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(COFLEET_BUNDLE_ID_PREFIX).mac.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CoFleetMac
