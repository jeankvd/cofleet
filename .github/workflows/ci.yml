name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep shellcheck
      - name: Validate repository
        env:
          COFLEET_GITLEAKS_EXTERNAL: "1"
        run: Scripts/check-repository.sh
      - name: Scan Git history and working tree for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  host-tests:
    name: Host tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run host and API tests
        env:
          PYTHONPATH: Services/CoFleetHost
          COFLEET_TEST_ROOT: ${{ runner.temp }}/cofleet-host-tests
        run: python -m unittest discover -s Tests/HostTests -v

  swift-tests:
    name: Swift package tests
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run isolated Swift tests
        env:
          CFFIXED_USER_HOME: ${{ runner.temp }}/cofleet-home
          COFLEET_TEST_ROOT: ${{ runner.temp }}/cofleet-swift-tests
        run: |
          mkdir -p "$CFFIXED_USER_HOME" "$COFLEET_TEST_ROOT"
          swift test --package-path Packages/CoFleetKit --enable-code-coverage

  project-generation:
    name: Project and Apple metadata
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install project tools
        run: brew bundle
      - name: Regenerate icons and project
        run: |
          Scripts/generate-app-icons.sh
          Scripts/generate-project.sh
      - name: Require deterministic generation
        run: git diff --exit-code -- Assets CoFleet.xcodeproj
      - name: Validate Apple metadata and source tree
        run: Scripts/check-repository.sh

  apple-builds:
    name: Unsigned ${{ matrix.name }} build
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Release
            kind: macos
          - name: iOS simulator
            kind: ios-simulator
          - name: generic iOS device
            kind: ios-device
          - name: watchOS
            kind: watch
          - name: iOS widgets
            kind: ios-widgets
          - name: Watch complications
            kind: watch-widgets
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build without signing, installing, or launching
        env:
          COFLEET_DERIVED_DATA: ${{ runner.temp }}/DerivedData
        run: Scripts/build.sh "${{ matrix.kind }}"
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs-${{ matrix.kind }}
          path: ${{ runner.temp }}/DerivedData/Logs
          if-no-files-found: ignore
          retention-days: 7
