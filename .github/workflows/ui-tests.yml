name: Simulator UI smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: read

concurrency:
  group: ui-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-smoke:
    name: ${{ matrix.platform }} UI smoke
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, macos]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run launch and Progress smoke
        run: Scripts/run-ui-tests.sh --platform "${{ matrix.platform }}"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-results-${{ matrix.platform }}
          path: .artifacts/**/*.xcresult
          if-no-files-found: error
          retention-days: 14
